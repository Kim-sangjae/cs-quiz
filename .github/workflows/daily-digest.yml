name: Daily Digest Email

# 매일 KST 약 08:07 = UTC 23:07 (전날)
# 정각(0분)은 GitHub Actions 스케줄 실행이 몰려 지연되기 쉬운 시간대라 7분으로 오프셋
# (https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule)
on:
  schedule:
    - cron: '7 23 * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Send daily digest (최대 3회, 30분 간격 재시도)
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "${{ secrets.APP_URL }}/api/admin/daily-digest" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Digest sent on attempt $attempt"
              exit 0
            fi
            echo "✗ Attempt $attempt failed (HTTP $STATUS)"
            if [ $attempt -lt 3 ]; then
              echo "30분 후 재시도..."
              sleep 1800
            fi
          done
          echo "✗ 3회 모두 실패"
          exit 1
