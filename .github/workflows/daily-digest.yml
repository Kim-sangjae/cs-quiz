name: Daily Digest Email

# 실제 발송 스케줄은 vercel.json의 crons(/api/admin/daily-digest)로 이전함.
# GitHub Actions의 schedule 트리거는 지정 시각 대비 몇 시간씩 지연되는 경우가 잦아서
# (실측: KST 08:07 예약 → 실제 11:31~14:01 사이에서 매번 들쭉날쭉 실행) 제거함.
# 이 워크플로우는 수동 실행/재시도용으로만 남겨둠.
on:
  workflow_dispatch: # 수동 실행 가능

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Send daily digest (최대 3회, 30분 간격 재시도)
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "${{ secrets.APP_URL }}/api/admin/daily-digest" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Digest sent on attempt $attempt"
              exit 0
            fi
            echo "✗ Attempt $attempt failed (HTTP $STATUS)"
            if [ $attempt -lt 3 ]; then
              echo "30분 후 재시도..."
              sleep 1800
            fi
          done
          echo "✗ 3회 모두 실패"
          exit 1
